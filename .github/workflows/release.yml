# Builds the Windows installer and publishes a GitHub Release whenever main has a version
# that was not released yet. Installed copies of Orbi read the latest release and offer the update.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[source-only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
        if: steps.v.outputs.exists == 'false'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists == 'false'
        with:
          node-version: 22
          cache: pnpm

      - name: Install tools
        if: steps.v.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          pnpm install --frozen-lockfile
          mkdir -p build/pty
          cd build/pty
          npm pack @lydell/node-pty-win32-x64@1.2.0-beta.18 --silent
          tar xzf lydell-node-pty-win32-x64-*.tgz
          rm -rf win32-x64 && mv package win32-x64 && rm -f *.tgz

      - name: Build installer
        if: steps.v.outputs.exists == 'false'
        run: |
          pnpm exec tsc --noEmit
          pnpm dist:win
          node build/ui-pack.cjs

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          NOTES=RELEASE_NOTES.md
          [ -f "$NOTES" ] || { echo "Orbi $V" > "$NOTES"; }
          gh release create "v$V" "release/Orbi-Setup-$V.exe" "release/orbi-ui-$V.asar" "release/orbi-ui-$V.json" --title "Orbi $V" --notes-file "$NOTES" --target "$GITHUB_SHA"
