name: Tauri native migration checks
on:
  push:
    branches: [codex/tauri-rust]
    paths: ['src-tauri/**', 'src/**', '.github/workflows/tauri-check.yml']
  workflow_dispatch:
  pull_request:
    paths: ['src-tauri/**', 'src/lib/tauriBridge.ts', '.github/workflows/tauri-check.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential librsvg2-dev patchelf libssl-dev libdbus-1-dev libayatana-appindicator3-dev
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      # Publishing remains intentionally disabled until native IPC parity is verified.
