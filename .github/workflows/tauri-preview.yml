name: Tauri preview packages
on:
  push:
    branches: [codex/tauri-rust]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential librsvg2-dev patchelf libssl-dev libdbus-1-dev libayatana-appindicator3-dev
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Package native preview
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm dlx @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
      - name: Upload preview installers (migration incomplete)
        uses: actions/upload-artifact@v4
        with:
          name: orbi-native-preview-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
